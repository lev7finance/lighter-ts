# Publish lighter-ts to npm.
#
# Triggered by publishing a GitHub release, or manually — and the manual path defaults to a dry run,
# because the only irreversible button in this repository is `npm publish`.
#
# Publishing goes through the **npm CLI**, not `bun publish`: Bun does not emit provenance
# attestations, and `publishConfig.provenance` plus `id-token: write` is the right posture for a
# package that signs financial transactions. The attestation binds the tarball to this workflow run
# and this commit, so a consumer can check that what they installed was built here.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every gate and `npm publish --dry-run`, then stop without publishing."
        type: boolean
        default: true

# Never cancel a half-finished publish: an interrupted `npm publish` can leave a version claimed on
# the registry that no tarball corresponds to, and versions are not reusable.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      # npm itself comes from setup-node; registry-url is what makes NODE_AUTH_TOKEN take effect.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      # The same gates as CI. A release can be cut from a commit CI never ran, so they run again
      # here rather than being trusted.
      - name: Build
        run: bun run build

      - name: Typecheck (nodenext + bundler)
        run: bun run lint

      - name: Test
        run: bun test

      - name: No dependencies, no Node built-ins in src/
        run: bun run check:deps

      - name: Exports map resolves, subpaths within budget
        run: bun run size

      # Three identities must agree before anything is published: the git tag, package.json, and the
      # literal in src/version.ts that the SDK reports in its User-Agent.
      - name: Tag matches package.json and src/version.ts
        if: github.event_name == 'release'
        run: |
          bun -e '
            const tag = process.env.GITHUB_REF_NAME ?? "";
            const pkg = JSON.parse(await Bun.file("package.json").text());
            const { VERSION } = await import("./src/version.ts");
            const expected = [pkg.version, `v${pkg.version}`];
            if (!expected.includes(tag)) {
              console.error(`tag ${tag} does not match package.json version ${pkg.version} (expected ${expected.join(" or ")})`);
              process.exit(1);
            }
            if (VERSION !== pkg.version) {
              console.error(`src/version.ts is ${VERSION}, package.json is ${pkg.version}`);
              process.exit(1);
            }
            console.log(`publishing ${pkg.name}@${pkg.version} from tag ${tag}`);
          '

      - name: npm publish (dry run)
        if: env.DRY_RUN == 'true'
        run: |
          npm publish --dry-run --access public
          echo "dry run: nothing was published (provenance is only generated on a real publish)"

      - name: npm publish
        if: env.DRY_RUN != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
